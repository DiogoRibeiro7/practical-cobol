name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compile-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Compile beginner examples
        run: bash scripts/compile_beginner_examples.sh

      - name: Compile all examples
        run: bash scripts/check_examples.sh
