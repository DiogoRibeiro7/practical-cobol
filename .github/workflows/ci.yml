name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  compile-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GnuCOBOL (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Compile beginner examples
        run: bash scripts/compile_beginner_examples.sh

      - name: Compile all examples
        run: bash scripts/check_examples.sh

      - name: Compile all exercises
        run: bash scripts/check_exercises.sh

  compile-examples-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GnuCOBOL (Windows via Chocolatey)
        shell: powershell
        run: |
          choco install -y gnucobol

      - name: Compile beginner examples
        run: bash -lc "scripts/compile_beginner_examples.sh"

      - name: Compile all examples
        run: bash -lc "scripts/check_examples.sh"

      - name: Compile all exercises
        run: bash -lc "scripts/check_exercises.sh"
